<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7f2">
    <meta name="description" content="スタドリの学習アプリ一覧">
    <title>スタドリ 学習アプリ</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #19352d;
        background: #f5f7f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background:
          radial-gradient(ellipse at 15% 10%, #dcebdd 0, transparent 34%),
          radial-gradient(ellipse at 90% 90%, #e9e5d5 0, transparent 38%),
          #f5f7f2;
      }

      main {
        width: min(100%, 720px);
        padding: clamp(36px, 8vw, 76px);
        border: 1px solid #dce5db;
        border-radius: 28px;
        background: rgb(255 255 255 / 82%);
        box-shadow: 0 24px 70px rgb(37 68 54 / 9%);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #4c8064;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.8rem, 10vw, 5rem);
        line-height: 1;
        letter-spacing: -0.075em;
      }

      .intro {
        max-width: 34rem;
        margin: 26px 0 0;
        color: #53665c;
        font-size: clamp(1rem, 2.5vw, 1.15rem);
        line-height: 1.9;
      }

      .link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 34px;
        padding: 13px 18px;
        border-radius: 999px;
        background: #244f3e;
        color: #fff;
        font-size: 0.95rem;
        font-weight: 650;
        text-decoration: none;
        transition: background-color 160ms ease, transform 160ms ease;
      }

      .link:hover {
        transform: translateY(-2px);
        background: #173d2e;
      }

      .link:focus-visible {
        outline: 3px solid #85b899;
        outline-offset: 4px;
      }

      .arrow {
        font-size: 1.1rem;
        line-height: 1;
      }

      .apps {
        display: grid;
        gap: 14px;
        margin-top: 34px;
      }

      .app-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border: 1px solid #dce5db;
        border-radius: 18px;
        color: #19352d;
        text-decoration: none;
        background: #fff;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .app-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgb(37 68 54 / 10%);
      }

      .app-link strong {
        display: block;
        margin-bottom: 4px;
        font-size: 1.05rem;
      }

      .app-link small {
        color: #698076;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Learning playground</p>
      <h1>スタドリ</h1>
      <p class="intro">遊びながら、毎日の「できた！」を増やそう。学びたいアプリを選んでね。</p>
      <div class="apps">
        <a class="app-link" href="apps/division/">
          <span><strong>算数・わり算編</strong><small>わり算のきほんから受験チャレンジまで</small></span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </main>
  </body>
</html>
